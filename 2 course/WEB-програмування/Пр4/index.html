<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список справ (REST API)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Мій список справ</h1>
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Що треба зробити?" required autocomplete="off">
            <button type="submit" id="submit-btn">Додати</button>
        </form>
        <div id="loading" class="hidden">Завантаження...</div>
        <div id="error-message" class="hidden"></div>
        <ul id="todo-list"></ul>
        <div class="counter">
            Всього завдань: <span id="total-count">0</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
