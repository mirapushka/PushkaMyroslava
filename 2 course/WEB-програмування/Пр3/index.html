<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список справ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Мій список справ</h1>

        <div class="input-section">
            <input type="text" id="todo-input" placeholder="Введіть нове завдання...">
            <button id="add-btn">Додати</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">Всі</button>
            <button class="filter-btn" data-filter="active">Активні</button>
            <button class="filter-btn" data-filter="completed">Виконані</button>
        </div>

        <ul id="todo-list"></ul>

        <div class="footer-section">
            <span id="task-counter">Всього: 0 | Не виконано: 0</span>
            <button id="clear-completed-btn">Очистити виконані</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
