<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя візитка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main">
        <section class="section">
            <img src="https://scontent-waw2-1.xx.fbcdn.net/v/t51.82787-15/750565520_18579190783071488_3218811082232822726_n.jpg?stp=dst-jpegr_tt6&cstp=mx3024x4032&ctp=s3024x4032&_nc_cat=109&ccb=1-7&_nc_sid=127cfc&_nc_ohc=kPv88-z-tvEQ7kNvwGZ2JgF&_nc_oc=AdriNb6iF6beYqlgg4vFbCCQ1554EYA1UDZqcjvoV_NLyZruO9IfEnKnQxfNQfW6oeU&_nc_zt=23&se=-1&_nc_ht=scontent-waw2-1.xx&_nc_gid=aPKgzzR5gRJgWb0kr9f2Dw&_nc_ss=7b2a8&oh=00_AQJfoegUl14qj0m0Biuwp11klaDOHUODImq3V3R4IVMhFw&oe=6AAE0A88" alt="Моє фото" class="avatar">

            <h1>Мирослава Пушка</h1>

            <p>Студентка ЄУ. Люблю вивчати світ та пробувати нове. Прагну розвиватися в IT-сфері.</p>

            <h3>Мої хобі:</h3>
            <ul>
                <li>Вивчення мов</li>
                <li>Гітара</li>
                <li>Йога</li>
            </ul>

            <p>Улюблений сайт: <a href="https://www.pinterest.com/" target="_blank">Pinterest</a></p>

            <button class="btn" id="bgToggleBtn">Увімкнути</button>
        </section>
    </main>

    <script>
        const btn = document.getElementById('bgToggleBtn');
        
        btn.addEventListener('click', () => {
            document.body.classList.toggle('animated-bg');
            
            if (document.body.classList.contains('animated-bg')) {
                btn.textContent = 'Вимкнути';
            } else {
                btn.textContent = 'Увімкнути';
            }
        });
    </script>

</body>
</html>
